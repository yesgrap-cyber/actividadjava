<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo interactivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: #ccc;">
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3 mt-5 text-center">
                <div class="semaforo mx-auto mb-4">
                    <div id="luzRoja" class="luz"></div>
                    <div id="luzAmarilla" class="luz"></div>
                    <div id="luzVerde" class="luz"></div>
                </div>

                <h3 id="mensaje" class="mb-4">Elige una luz</h3>

                <div class="d-flex justify-content-center gap-2">
                    <button id="btnRojo" class="btn btn-danger">Rojo</button>
                    <button id="btnAmarillo" class="btn btn-warning">Amarillo</button>
                    <button id="btnVerde" class="btn btn-success">Verde</button>
                </div>

            </div>
        </div>
    </div>












    <script src="app.js"></script>
</body>

</html>
