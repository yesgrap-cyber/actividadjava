<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

</head>

<body style="background-color: #ccc;">
    <div class="container">
        <div class="row">
            <div class="col-md-4 offset-md-4 mt-5">
                <div class="card">
                    <div class="card-body">
                        <input type="text" id="peso" placeholder="Peso en kg">
                        <input type="text" id="estatura" placeholder="Estatura en metros">
                        <button id="calcular" class="btn btn-primary w-100">Calcular IMC</button>
                        <p id="texto"></p><br>
                    </div>

                </div>
            </div>
        </div>
    </div>





    <script src="app.js"></script>

</body>

</html>
