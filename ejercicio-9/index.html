<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de perfil en vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3 mt-5">

                <div class="card mb-4">
                    <div class="card-body">
                        <input type="text" id="nombre" placeholder="Nombre" class="form-control">
                        <input type="text" id="profesion" placeholder="Profesion" class="form-control">
                        <input type="url" id="foto" placeholder="URL  foto" class="form-control">
                        
                    </div>
                </div>

                 <div class="card text-center">
                    <div class="card-body">
                        <img id="tarjetafoto" src="https://placehold.co/120" alt="Foto de Perfil" class="rounded-circle mb-3" width="120" height="120" style="object-fit: cover;">
                        <h2 id="tarjetanombre">Tu nombre</h2>
                        <p id="tarjetaprofesion" class="text-muted">Tu profesion</p>
                    </div>
                </div>
            </div>
        </div>
    </div>







<script src="app.js"></script>
</body>
</html>
